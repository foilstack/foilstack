name: release

# Publishing is deliberately manual and tag-driven. A release on every push to
# main would mean any merge burns a version number on PyPI, where versions
# cannot be reused or deleted — only yanked.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build

      # The wheel carries the templates, the static files and the migrations,
      # none of which are Python and any of which can silently stop being
      # included. Checked here rather than discovered by whoever pip-installs
      # the release: a package that imports fine and 500s on its first page is
      # worse than one that fails to build.
      #
      # The static files are derived from the templates rather than listed.
      # A hand-kept list only covers what somebody remembered to add, and
      # `app.js` — the file that holds every screen's shared behaviour — was
      # missing from it for a whole release. A missing script is the quiet
      # kind of broken, too: the pages render and every button is dead.
      - name: the wheel has to contain more than Python
        run: |
          python - <<'PY'
          import glob, re, sys, zipfile

          whl = glob.glob("dist/*.whl")[0]
          zf = zipfile.ZipFile(whl)
          names = set(zf.namelist())

          required = [
              "foilstack/web/templates/base.html",
              "foilstack/migrations/env.py",
          ]

          # Anything a packaged template asks for by URL has to be packaged
          # too: `/static/app.css?v=...` -> foilstack/web/static/app.css
          versioned = re.compile(rb"/static/([A-Za-z0-9_./-]+)\?v=")
          wanted = set()
          for name in names:
              if name.startswith("foilstack/web/templates/") and name.endswith(".html"):
                  wanted |= {m.decode() for m in versioned.findall(zf.read(name))}
          required += [f"foilstack/web/static/{asset}" for asset in sorted(wanted)]

          # A guard on the guard. If the templates stop matching — renamed
          # directory, different query string — this check would pass by
          # finding nothing to look for, which is the failure it exists to
          # prevent wearing a disguise.
          if len(wanted) < 3:
              sys.exit(f"only {len(wanted)} versioned assets found in the templates; "
                       "the pattern is probably no longer matching")

          missing = [r for r in required if r not in names]
          revisions = [n for n in names if "/migrations/versions/" in n and n.endswith(".py")]
          if missing:
              sys.exit(f"missing from {whl}: {missing}")
          if not revisions:
              sys.exit(f"no migration revisions in {whl}")
          print(f"{whl}: {len(names)} files, {len(revisions)} migrations, "
                f"{len(wanted)} versioned assets")
          for asset in sorted(wanted):
              print(f"  static/{asset}")
          PY

      # The tag is a claim about what is inside the wheel, and nothing else
      # checks it. Hatchling reads the version from
      # `src/foilstack/__init__.py`, so tagging v0.2.0 against a source that
      # still says 0.1.21 publishes 0.1.21 — under a tag that says otherwise,
      # to an index where that number can never be corrected.
      - name: the tag has to match the version in the wheel
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import glob, os, sys
          built = os.path.basename(glob.glob("dist/*.whl")[0]).split("-")[1]
          tagged = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if built != tagged:
              sys.exit(f"tag says {tagged}, wheel says {built} — refusing to publish")
          print(f"tag and wheel agree on {built}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there
    # is no API token to store, rotate or leak.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
