[project]
name = "foilstack"
version = "0.1.0"
description = "Open-source card scanning, inventory and listing export. Self-hostable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
embedder = ["torch>=2.2", "transformers>=4.44"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "playwright>=1.48"]

# Installs a `foilstack` command. Without it the CLI is only reachable as
# `python -m foilstack.cli`, which is not what the README says and not what
# anybody types.
[project.scripts]
foilstack = "foilstack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foilstack"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]

[tool.ruff]
# Wider than the default 88. The prose comments in this codebase are wrapped
# to about 79 and the code sits comfortably under 100; at 88 the formatter
# explodes several readable tables — the pricing rules, the queue row builder —
# into one item per line for the sake of a few characters.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "BLE",      # blind except
    "RUF",
]
ignore = [
    # `assert` in tests is the point of tests.
    "S101",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is function calls in argument defaults —
# `Depends()`, `Query()`, `Form()`, `File()`. B008 exists to catch a mutable
# default evaluated once by accident; these are evaluated once on purpose and
# are the documented way to use the framework. Exempting them by name rather
# than switching B008 off keeps the rule working everywhere else.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Form",
    "fastapi.File", "fastapi.Body", "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated, then annotated by hand. Import order and line
# length in them are alembic's business, not ours.
"migrations/versions/*" = ["E501", "I001"]

[tool.ruff.format]
docstring-code-format = true
